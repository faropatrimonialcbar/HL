<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Financiero Semanal</title>
  <!-- Tailwind CSS para diseño adaptable a móvil y PC -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-8">

  <div class="max-w-3xl mx-auto space-y-6">
    <header class="text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-900">Control Financiero</h1>
      <p class="text-sm text-gray-600">Sincronizado en tiempo real</p>
    </header>

    <!-- Tarjeta de Estado de Deuda / Crédito -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 text-center">
      <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Crédito / Deuda Acumulada a Netear</h2>
      <p id="deuda-total" class="text-3xl md:text-4xl font-extrabold text-red-600 mt-2">$0.00</p>
    </div>

    <!-- Formulario para Registrar Transacción -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-lg font-bold mb-4 text-gray-800">Registrar Movimiento</h2>
      <form id="form-transaccion" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tipo</label>
          <select id="tipo" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
            <option value="ingreso">Ingreso (+)</option>
            <option value="gasto">Gasto (-)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Monto ($)</label>
          <input type="number" step="0.01" id="monto" required placeholder="0.00" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">N° de Semana</label>
          <input type="number" id="semana" required placeholder="Ej: 38" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción</label>
          <input type="text" id="descripcion" placeholder="Ej: Cobro de honorarios" class="w-full border rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="md:col-span-2">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
            Guardar Movimiento
          </button>
        </div>
      </form>
    </div>

    <!-- Cierre Semanal -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-lg font-bold mb-2 text-gray-800">Procesar Cierre Semanal</h2>
      <p class="text-xs text-gray-500 mb-4">Ejecuta el neteo de la semana seleccionada, reembolsa deudas pendientes o calcula la ganancia distribuible.</p>
      <div class="flex gap-4">
        <input type="number" id="semana-cierre" placeholder="N° Semana" class="border rounded-lg p-2.5 w-1/2 bg-gray-50">
        <button onclick="ejecutarCierre()" class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg transition-colors">
          Ejecutar Cierre
        </button>
      </div>
    </div>

    <!-- Ultimas Transacciones -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-lg font-bold mb-4 text-gray-800">Últimos Movimientos</h2>
      <ul id="lista-transacciones" class="divide-y divide-gray-100">
        <!-- Se cargan dinámicamente -->
      </ul>
    </div>
  </div>

  <script>
    // Configuración de Supabase (REEMPLAZA CON TUS DATOS)
    const SUPABASE_URL = https://potcjvonrebhynjcbjmk.supabase.co/rest/v1/;
    const SUPABASE_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvdGNqdm9ucmViaHluamNiam1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDg0OTYsImV4cCI6MjEwNTY4NDQ5Nn0.Vfgerj4RsWl3h2B_PAFKdoftDKuUoShLEh0mZs8D29k;

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Calcular semana del año actual por defecto
    function getWeekNumber(d) {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
      var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    document.getElementById('semana').value = getWeekNumber(new Date());
    document.getElementById('semana-cierre').value = getWeekNumber(new Date());

    // Cargar Datos Iniciales
    async function cargarDatos() {
      // 1. Obtener Deuda Actual
      const { data: estado } = await supabaseClient.from('estado_credito').select('saldo_pendiente').single();
      if (estado) {
        document.getElementById('deuda-total').innerText = `$${Number(estado.saldo_pendiente).toLocaleString('es-AR', { minimumFractionDigits: 2 })}`;
      }

      // 2. Obtener Transacciones
      const { data: transacciones } = await supabaseClient.from('transacciones').select('*').order('created_at', { ascending: false }).limit(10);
      const lista = document.getElementById('lista-transacciones');
      lista.innerHTML = '';

      if (transacciones) {
        transacciones.forEach(t => {
          const li = document.createElement('li');
          li.className = 'py-3 flex justify-between items-center text-sm';
          const esIngreso = t.tipo === 'ingreso';
          li.innerHTML = `
            <div>
              <p class="font-semibold text-gray-800">${t.descripcion || 'Sin descripción'}</p>
              <p class="text-xs text-gray-400">Semana ${t.semana_num} - ${t.fecha}</p>
            </div>
            <span class="font-bold ${esIngreso ? 'text-green-600' : 'text-red-600'}">
              ${esIngreso ? '+' : '-'}$${Number(t.monto).toLocaleString('es-AR', { minimumFractionDigits: 2 })}
            </span>
          `;
          lista.appendChild(li);
        });
      }
    }

    // Guardar Transacción
    document.getElementById('form-transaccion').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tipo = document.getElementById('tipo').value;
      const monto = parseFloat(document.getElementById('monto').value);
      const semana_num = parseInt(document.getElementById('semana').value);
      const descripcion = document.getElementById('descripcion').value;

      const { error } = await supabaseClient.from('transacciones').insert([{ tipo, monto, semana_num, descripcion }]);

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        document.getElementById('monto').value = '';
        document.getElementById('descripcion').value = '';
        cargarDatos();
      }
    });

    // Ejecutar Cierre Semanal
    async function ejecutarCierre() {
      const semana = parseInt(document.getElementById('semana-cierre').value);
      const anio = new Date().getFullYear();

      const { error } = await supabaseClient.rpc('procesar_cierre_semanal', { p_semana: semana, p_anio: anio });

      if (error) {
        alert('Error al procesar el cierre: ' + error.message);
      } else {
        alert(`Cierre de la semana ${semana} procesado correctamente.`);
        cargarDatos();
      }
    }

    // Carga inicial
    cargarDatos();
  </script>
</body>
</html>
